# Site subdomain is set in Netlify UI/API (not in this file).
# Linked site: https://arkive-beta.netlify.app

[build]
  command = "VITE_STRICT_PRODUCTION=false npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_OPTIONS = "--experimental-require-module"

[[redirects]]
  from = "/api/turbo/health"
  to = "/.netlify/functions/turbo-api"
  status = 200

[[redirects]]
  from = "/api/turbo/sponsor-feed"
  to = "/.netlify/functions/turbo-api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
