# Site subdomain is set in Netlify UI/API (not in this file).
# Linked site: https://arkive-beta.netlify.app

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_OPTIONS = "--experimental-require-module"

[[redirects]]
  from = "/api/turbo/health"
  to = "/.netlify/functions/turbo-api"
  status = 200

[[redirects]]
  from = "/api/turbo/sponsor-feed"
  to = "/.netlify/functions/turbo-api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: wss: http://127.0.0.1:11434 http://localhost:11434; frame-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
